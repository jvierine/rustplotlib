[package]
name = "rustplotlib"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Scientific figures with LaTeX typography and Rust rendering"
repository = "https://github.com/jvierine/rustplotlib"

[workspace]
members = ["viewer"]
default-members = ["."]

[features]
default = ["export"]
export = ["dep:resvg", "dep:svg2pdf"]
hdf5-examples = ["dep:hdf5"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18"
resvg = { version = "0.45", optional = true }
svg2pdf = { version = "0.13", optional = true }

hdf5 = { package = "hdf5-metno", version = "0.12", optional = true }

[[example]]
name = "syisr_khi"
required-features = ["export", "hdf5-examples"]

[profile.release]
lto = "thin"

[dev-dependencies]
rustfft = "6.4"
libm = "0.2"
