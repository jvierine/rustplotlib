<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>rustplotlib</title>
<style>
:root{font-family:Georgia,serif;color:#212329;background:#fff;font-size:18px}*{box-sizing:border-box}body{margin:0 auto;max-width:1300px;padding:28px}header{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 26px}h1{font-weight:normal;font-size:30px;margin:0}header a{font-size:16px;color:#315769;text-decoration:none}main{display:grid;grid-template-columns:1fr 1fr;gap:34px}h2{font-size:22px;font-weight:normal;margin:0 0 16px}p{line-height:1.45;color:#50545a}figure{margin:0}canvas{width:100%;display:block;background:#fff;touch-action:none}.volume{cursor:grab}.volume:active{cursor:grabbing}.labels{display:block;width:100%;height:50px;object-fit:contain}.gradient{height:8px;margin:16px 24px 0;background:linear-gradient(to right,#214273,#5794b3,#f7f5ed,#d1754f,#7d212e)}.volume-gradient{background:linear-gradient(to right,#264773,#c56347,#ffd989)}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;font:15px system-ui;margin:16px 0}button,select{font:inherit;border:1px solid #b6b9bd;background:white;padding:6px 12px;border-radius:3px;color:#202328;cursor:pointer}input[type=range]{flex:1;min-width:100px;accent-color:#315769}output{font:14px system-ui;color:#62676d;min-height:20px;display:block}.note{font-size:15px}section{min-width:0}.export{border-top:1px solid #ddd;margin-top:35px;padding-top:22px}.export a{color:#315769;margin-right:18px}#status{font:14px system-ui;color:#697079;margin-top:24px}@media(max-width:760px){body{padding:18px;font-size:18px}main{grid-template-columns:1fr;gap:28px}header{margin-bottom:24px}h1{font-size:27px}.controls{font-size:16px}canvas{max-height:450px}.export a{display:inline-block;margin-bottom:12px}}
</style></head><body>
<header><h1>rustplotlib</h1><a href="https://github.com/jvierine/rustplotlib">Source</a></header>
<main><section><h2>Scalar field</h2><figure><canvas id="field" width="720" height="445"></canvas><div class="gradient" id="field-bar"></div><img class="labels" src="data/field_label.svg" alt="Pressure perturbation in percent, minus one to one"></figure><div class="controls"><button id="play-field">Play</button><input id="field-time" type="range" min="0" max="31" value="0" aria-label="Field frame"><select id="normalization" aria-label="Normalization"><option value="0">Linear</option><option value="2">Signed asinh</option></select></div><output id="probe">Move over the field to inspect values.</output></section>
<section><h2>Volume</h2><figure><canvas id="volume" class="volume" width="640" height="480"></canvas><div class="gradient volume-gradient"></div><img class="labels" src="data/volume_label.svg" alt="Normalized vorticity magnitude"></figure><div class="controls"><button id="play-volume">Play</button><input id="volume-time" type="range" min="0" max="23" value="0" aria-label="Volume frame"></div><div class="controls"><label for="opacity">Opacity</label><input id="opacity" type="range" min="0.1" max="8" step="0.1" value="2"><button id="reset-camera">Reset view</button><button id="save-volume">Save PNG</button></div><p class="note">Drag to rotate. The example uses analytic vortex-ring fields; the viewer accepts scalar volumes from a solver.</p></section></main>
<section class="export"><h2>Publication figures</h2><a href="gallery/index.html">Full gallery</a><a href="gallery/fields.pdf">PDF</a><a href="gallery/fields.png">PNG</a><a href="gallery/fields.jpg">JPEG</a><a href="gallery/fields.svg">SVG</a><a href="gallery/single_column.pdf">Single-column PDF</a></section>
<p id="status">Loading Rust/WASM renderer…</p><script type="module" src="dist/app.js"></script></body></html>
