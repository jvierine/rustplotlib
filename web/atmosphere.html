<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spherical atmosphere · rustplotlib</title><style>body{max-width:1500px;margin:30px auto;padding:0 20px;background:white;color:#252c31;font:18px Georgia,serif}h1,h2{font-weight:normal}header{display:flex;justify-content:space-between;align-items:center}main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}canvas{width:100%;height:auto;touch-action:none}img{width:100%}h2{font-size:21px;margin-bottom:0}button{background:white;border:1px solid #abb5bd;padding:8px;font:16px Georgia}a{color:#315769}@media(max-width:800px){main{grid-template-columns:1fr}}</style><header><h1>Spherical atmosphere</h1><a href="gallery/index.html">Gallery</a></header><main><section><h2>A · Temperature</h2><canvas id="temperature" width="600" height="600"></canvas><img src="data/atmosphere/temperature.svg" alt="Temperature in kelvin"></section><section><h2>B · Electron density</h2><canvas id="electron_density" width="600" height="600"></canvas><img src="data/atmosphere/electron_density.svg" alt="Electron density per cubic metre"></section><section><h2>C · Zonal wind</h2><canvas id="zonal_wind" width="600" height="600"></canvas><img src="data/atmosphere/zonal_wind.svg" alt="East wind metres per second"></section></main><button id="rotate">Rotate</button><p>Analytic demonstration fields. Drag each shell to rotate. Radial scale expanded to show 0–500 km; opaque core and exposed slices.</p><script type="module" src="dist/atmosphere.js"></script></html>
