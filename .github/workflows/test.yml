name: Test
on: [push, pull_request]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  figures-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended dvisvgm poppler-utils libhdf5-dev
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test Rust workspace
        run: cargo test --workspace
      - run: cargo run --release --example publication
      - run: cargo run --release --example gallery
      - run: cargo run --release --example secondary_axis
      - run: cargo run --release --features hdf5-examples --example syisr_khi
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci && npx playwright install --with-deps chromium && npm run build && npx tsc --noEmit
      - run: |
          node scripts/serve.mjs &
          server=$!
          trap 'kill "$server"' EXIT
          npm run test:web
          node scripts/test_cartography.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: figures-and-browser-validation
          path: |
            gallery/
            validation/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: web
  publish-gallery:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: figures-and-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish gallery
        id: deployment
        uses: actions/deploy-pages@v4
