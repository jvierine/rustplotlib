name: Test
on: [push, pull_request]
jobs:
  figures-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended dvisvgm poppler-utils
      - run: cargo fmt --all --check && cargo test
      - run: cargo run --release --example publication
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci && npx playwright install --with-deps chromium && npm run build && npx tsc --noEmit
      - run: |
          node scripts/serve.mjs &
          server=$!
          trap 'kill "$server"' EXIT
          npm run test:web
      - uses: actions/upload-artifact@v4
        with:
          name: figures-and-browser-validation
          path: |
            gallery/
            validation/
